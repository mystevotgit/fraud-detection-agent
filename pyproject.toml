[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cost-sensitive fraud-detection-agent"
version = "0.1.0"
description = "Cost-sensitive credit card fraud detection agent."
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

